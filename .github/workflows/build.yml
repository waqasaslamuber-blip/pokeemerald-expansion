name: Build GBA ROM
on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout agbcc
        uses: actions/checkout@v4
        with:
          repository: pret/agbcc
          path: agbcc

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi build-essential libpng-dev

      - name: Build agbcc
        run: |
          cd agbcc
          ./build.sh
          ./install.sh ../
          cd ..

      - name: Build ROM
        run: |
          make -j$(nproc)
